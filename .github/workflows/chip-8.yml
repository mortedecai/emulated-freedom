name: CHIP-8

on:
  push:
    branches:
      - main
      - "interpreter/**"
    paths:
      - "java/chip-8/**"
      - ".github/workflows/chip-8.yml"
  pull_request:
    branches:
      - main
    paths:
      - "java/chip-8/**"
      - ".github/workflows/chip-8.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: "26"
          distribution: "temurin"
          cache: "gradle"

      - name: Run tests and generate coverage report
        working-directory: java/chip-8
        run: ./gradlew test jacocoTestReport

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: java/chip-8/build/reports/tests/test/
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: java/chip-8/build/reports/jacoco/test/html/
          retention-days: 30
